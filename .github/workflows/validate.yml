name: Templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Catalog checks
    runs-on: ubuntu-latest
    outputs:
      tooling: ${{ steps.changes.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for tooling changes
        id: changes
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo 'tooling=true' >> "$GITHUB_OUTPUT"
          else
            if [ "$EVENT" = pull_request ]; then
              BEFORE=$(git merge-base "$BEFORE" "$AFTER")
            fi
            changes=$(git diff --name-only "$BEFORE" "$AFTER" -- action.yml scripts .github/workflows)
            if [ -n "$changes" ]; then
              echo 'tooling=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download CLI
        id: cli
        run: bash scripts/download-cli.sh "$RUNNER_TEMP/zrs-template"

      - name: Validate Networking
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        working-directory: catalogs/networking
        run: |
          "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image
          "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image \
            --patterns=$'templates/**/*.json\npacks/**/*.json\n**/*.source.json'

      - name: Validate Media
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        working-directory: catalogs/media
        run: |
          "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image
          "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image \
            --patterns=$'templates/**/*.json\npacks/**/*.json\n**/*.source.json'

      - name: Validate Development
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        working-directory: catalogs/development
        run: |
          "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image
          "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image \
            --patterns=$'templates/**/*.json\npacks/**/*.json\n**/*.source.json'

      - name: Validate Gaming
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        working-directory: catalogs/gaming
        run: |
          "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image
          "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image \
            --patterns=$'templates/**/*.json\npacks/**/*.json\n**/*.source.json'

  tooling:
    name: Tooling tests
    needs: validate
    if: ${{ !cancelled() && needs.validate.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Action
        run: bash scripts/test-action.sh

      - name: Test catalog publishing
        run: bash scripts/test-catalog-publish.sh

      - name: Test catalog selection
        run: bash scripts/test-changed-catalogs.sh
