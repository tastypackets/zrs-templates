name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test tooling
        run: |
          bash scripts/test-action.sh
          bash scripts/test-catalog-publish.sh
          bash scripts/test-changed-catalogs.sh

      - name: Download CLI
        run: bash scripts/download-cli.sh "$RUNNER_TEMP/zrs-template"

      - name: Build and lint catalogs
        run: |
          for catalog in networking media development gaming; do
            (
              cd "catalogs/$catalog"
              echo "::group::$catalog"
              "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image
              "$RUNNER_TEMP/zrs-template" --strict --allow=unpinned_image \
                --patterns=$'templates/**/*.json\npacks/**/*.json\n**/*.source.json'
              echo '::endgroup::'
            )
          done
