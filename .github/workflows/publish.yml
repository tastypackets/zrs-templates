name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      matrix:
        catalog: [core, media, development, gaming]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and validate the source
        uses: ./
        with:
          working-directory: catalogs/${{ matrix.catalog }}

      - uses: actions/upload-artifact@v7
        with:
          name: zrs-${{ matrix.catalog }}-source
          path: catalogs/${{ matrix.catalog }}/templates.source.json
          if-no-files-found: error

      - name: Publish catalog to R2
        if: github.repository == 'tastypackets/zrs-templates' && github.ref == 'refs/heads/main'
        env:
          CATALOG: ${{ matrix.catalog }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_TEMPLATES_BUCKET: ${{ vars.R2_TEMPLATES_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_TEMPLATES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_TEMPLATES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: bash scripts/publish-catalog.sh "$CATALOG"
